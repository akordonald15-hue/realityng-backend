services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-realityng}
      POSTGRES_USER: ${POSTGRES_USER:-realityng}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-realityng}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realityng-backend

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realityng-backend

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-59000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-59001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - realityng-backend

  minio-create-bucket:
    image: minio/mc:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-realityng-local}
      VERIFICATION_DOCUMENT_BUCKET_NAME: ${VERIFICATION_DOCUMENT_BUCKET_NAME:-realityng-verification-private}
      WALKTHROUGH_STORAGE_BUCKET: ${WALKTHROUGH_STORAGE_BUCKET:-realityng-walkthroughs}
      INSPECTION_EVIDENCE_BUCKET: ${INSPECTION_EVIDENCE_BUCKET:-realityng-inspection-evidence}
      INSPECTION_REPORT_BUCKET: ${INSPECTION_REPORT_BUCKET:-realityng-inspection-reports}
      CONSTRUCTION_EVIDENCE_BUCKET: ${CONSTRUCTION_EVIDENCE_BUCKET:-realityng-construction-evidence}
      PAYMENT_PROOF_BUCKET_NAME: ${PAYMENT_PROOF_BUCKET_NAME:-realityng-payment-proof-private}
      FINANCING_DOCUMENT_BUCKET_NAME: ${FINANCING_DOCUMENT_BUCKET_NAME:-realityng-financing-documents-private}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
      mc mb --ignore-existing "local/$${MINIO_BUCKET_NAME}" &&
      mc anonymous set download "local/$${MINIO_BUCKET_NAME}" &&
      mc mb --ignore-existing "local/$${VERIFICATION_DOCUMENT_BUCKET_NAME}" &&
      mc anonymous set none "local/$${VERIFICATION_DOCUMENT_BUCKET_NAME}" &&
      mc mb --ignore-existing "local/$${WALKTHROUGH_STORAGE_BUCKET}" &&
      mc anonymous set download "local/$${WALKTHROUGH_STORAGE_BUCKET}" &&
      mc mb --ignore-existing "local/$${INSPECTION_EVIDENCE_BUCKET}" &&
      mc anonymous set none "local/$${INSPECTION_EVIDENCE_BUCKET}" &&
      mc mb --ignore-existing "local/$${INSPECTION_REPORT_BUCKET}" &&
      mc anonymous set none "local/$${INSPECTION_REPORT_BUCKET}" &&
      mc mb --ignore-existing "local/$${CONSTRUCTION_EVIDENCE_BUCKET}" &&
      mc anonymous set none "local/$${CONSTRUCTION_EVIDENCE_BUCKET}" &&
      mc mb --ignore-existing "local/$${PAYMENT_PROOF_BUCKET_NAME}" &&
      mc anonymous set none "local/$${PAYMENT_PROOF_BUCKET_NAME}" &&
      mc mb --ignore-existing "local/$${FINANCING_DOCUMENT_BUCKET_NAME}" &&
      mc anonymous set none "local/$${FINANCING_DOCUMENT_BUCKET_NAME}"
      "
    networks:
      - realityng-backend

  backend:
    build:
      context: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: local-development-secret
      DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_URL: postgres://realityng:realityng@postgres:5432/realityng
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:59000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-realityng-local}
      VERIFICATION_DOCUMENT_BUCKET_NAME: ${VERIFICATION_DOCUMENT_BUCKET_NAME:-realityng-verification-private}
      WALKTHROUGH_STORAGE_BUCKET: ${WALKTHROUGH_STORAGE_BUCKET:-realityng-walkthroughs}
      WALKTHROUGH_MAX_FILE_SIZE_MB: "100"
      WALKTHROUGH_MAX_VIDEOS_PER_PROPERTY: "3"
      WALKTHROUGH_ALLOWED_MIME_TYPES: video/mp4,video/webm
      WALKTHROUGH_ALLOWED_EXTENSIONS: .mp4,.webm
      WALKTHROUGH_REQUIRE_MODERATION: "true"
      INSPECTION_EVIDENCE_BUCKET: realityng-inspection-evidence
      INSPECTION_REPORT_BUCKET: realityng-inspection-reports
      INSPECTION_SIGNED_URL_EXPIRY_SECONDS: "300"
      INSPECTION_MAX_EVIDENCE_FILE_SIZE_MB: "25"
      INSPECTION_MAX_REPORT_FILE_SIZE_MB: "25"
      CONSTRUCTION_EVIDENCE_BUCKET: realityng-construction-evidence
      CONSTRUCTION_SIGNED_URL_EXPIRY_SECONDS: "300"
      CONSTRUCTION_MAX_IMAGE_SIZE_MB: "25"
      CONSTRUCTION_MAX_VIDEO_SIZE_MB: "100"
      CONSTRUCTION_MAX_DOCUMENT_SIZE_MB: "25"
      PAYMENT_PROOF_BUCKET_NAME: ${PAYMENT_PROOF_BUCKET_NAME:-realityng-payment-proof-private}
      PAYMENT_PROOF_SIGNED_URL_EXPIRY: "300"
      PAYMENT_PROOF_MAX_SIZE_MB: "10"
      PAYMENT_PROOF_ALLOWED_TYPES: application/pdf,image/jpeg,image/png
      PAYMENT_PROOF_ALLOWED_EXTENSIONS: .pdf,.jpg,.jpeg,.png
      FINANCING_DOCUMENT_BUCKET_NAME: ${FINANCING_DOCUMENT_BUCKET_NAME:-realityng-financing-documents-private}
      FINANCING_DOCUMENT_SIGNED_URL_EXPIRY: "300"
      FINANCING_DOCUMENT_MAX_SIZE_MB: "10"
      FINANCING_DOCUMENT_ALLOWED_TYPES: application/pdf,image/jpeg,image/png
      FINANCING_DOCUMENT_ALLOWED_EXTENSIONS: .pdf,.jpg,.jpeg,.png
      FINANCING_CONSENT_TERMS_VERSION: ${FINANCING_CONSENT_TERMS_VERSION:-2026-08}
      USE_S3_MEDIA_STORAGE: "true"
      PROPERTY_IMAGE_MAX_COUNT: "30"
      PROPERTY_IMAGE_MAX_SIZE_MB: "10"
      PROPERTY_IMAGE_ALLOWED_TYPES: image/jpeg,image/png,image/webp
      PROPERTY_IMAGE_ALLOWED_EXTENSIONS: .jpg,.jpeg,.png,.webp
      SENTRY_DSN: ""
      SENTRY_ENVIRONMENT: local
      LANDLORD_ROLE_AUTO_APPROVAL: "true"
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-58000}:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 5
    networks:
      - realityng-backend

  celery:
    build:
      context: .
    command: celery -A config.celery worker --loglevel=INFO
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: local-development-secret
      DEBUG: "true"
      DATABASE_URL: postgres://realityng:realityng@postgres:5432/realityng
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SENTRY_DSN: ""
    volumes:
      - .:/app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('redis', 6379), 5).close()\""]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - realityng-backend

  celery-beat:
    build:
      context: .
    command: celery -A config.celery beat --loglevel=INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler --pidfile=/tmp/celerybeat.pid
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: local-development-secret
      DEBUG: "true"
      DATABASE_URL: postgres://realityng:realityng@postgres:5432/realityng
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SENTRY_DSN: ""
    volumes:
      - .:/app
    depends_on:
      backend:
        condition: service_healthy
      celery:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - realityng-backend

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  realityng-backend:
    driver: bridge
