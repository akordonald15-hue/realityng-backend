services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: realityng
      POSTGRES_USER: realityng
      POSTGRES_PASSWORD: realityng
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realityng -d realityng"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realityng-backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realityng-backend

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - realityng-backend

  minio-create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/realityng-local &&
      mc anonymous set download local/realityng-local &&
      mc mb --ignore-existing local/realityng-verification-private &&
      mc anonymous set none local/realityng-verification-private &&
      mc mb --ignore-existing local/realityng-walkthroughs &&
      mc anonymous set download local/realityng-walkthroughs &&
      mc mb --ignore-existing local/realityng-inspection-evidence &&
      mc anonymous set none local/realityng-inspection-evidence &&
      mc mb --ignore-existing local/realityng-inspection-reports &&
      mc anonymous set none local/realityng-inspection-reports &&
      mc mb --ignore-existing local/realityng-construction-evidence &&
      mc anonymous set none local/realityng-construction-evidence &&
      mc mb --ignore-existing local/realityng-payment-proof-private &&
      mc anonymous set none local/realityng-payment-proof-private
      "
    networks:
      - realityng-backend

  backend:
    build:
      context: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: local-development-secret
      DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_URL: postgres://realityng:realityng@postgres:5432/realityng
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: realityng-local
      VERIFICATION_DOCUMENT_BUCKET_NAME: realityng-verification-private
      WALKTHROUGH_STORAGE_BUCKET: realityng-walkthroughs
      WALKTHROUGH_MAX_FILE_SIZE_MB: "100"
      WALKTHROUGH_MAX_VIDEOS_PER_PROPERTY: "3"
      WALKTHROUGH_ALLOWED_MIME_TYPES: video/mp4,video/webm
      WALKTHROUGH_ALLOWED_EXTENSIONS: .mp4,.webm
      WALKTHROUGH_REQUIRE_MODERATION: "true"
      INSPECTION_EVIDENCE_BUCKET: realityng-inspection-evidence
      INSPECTION_REPORT_BUCKET: realityng-inspection-reports
      INSPECTION_SIGNED_URL_EXPIRY_SECONDS: "300"
      INSPECTION_MAX_EVIDENCE_FILE_SIZE_MB: "25"
      INSPECTION_MAX_REPORT_FILE_SIZE_MB: "25"
      CONSTRUCTION_EVIDENCE_BUCKET: realityng-construction-evidence
      CONSTRUCTION_SIGNED_URL_EXPIRY_SECONDS: "300"
      CONSTRUCTION_MAX_IMAGE_SIZE_MB: "25"
      CONSTRUCTION_MAX_VIDEO_SIZE_MB: "100"
      CONSTRUCTION_MAX_DOCUMENT_SIZE_MB: "25"
      PAYMENT_PROOF_BUCKET_NAME: realityng-payment-proof-private
      PAYMENT_PROOF_SIGNED_URL_EXPIRY: "300"
      PAYMENT_PROOF_MAX_SIZE_MB: "10"
      PAYMENT_PROOF_ALLOWED_TYPES: application/pdf,image/jpeg,image/png
      PAYMENT_PROOF_ALLOWED_EXTENSIONS: .pdf,.jpg,.jpeg,.png
      USE_S3_MEDIA_STORAGE: "true"
      PROPERTY_IMAGE_MAX_COUNT: "30"
      PROPERTY_IMAGE_MAX_SIZE_MB: "10"
      PROPERTY_IMAGE_ALLOWED_TYPES: image/jpeg,image/png,image/webp
      PROPERTY_IMAGE_ALLOWED_EXTENSIONS: .jpg,.jpeg,.png,.webp
      SENTRY_DSN: ""
      SENTRY_ENVIRONMENT: local
      LANDLORD_ROLE_AUTO_APPROVAL: "true"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 5
    networks:
      - realityng-backend

  celery:
    build:
      context: .
    command: celery -A config.celery worker --loglevel=INFO
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: local-development-secret
      DEBUG: "true"
      DATABASE_URL: postgres://realityng:realityng@postgres:5432/realityng
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SENTRY_DSN: ""
    volumes:
      - .:/app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('redis', 6379), 5).close()\""]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - realityng-backend

  celery-beat:
    build:
      context: .
    command: celery -A config.celery beat --loglevel=INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler --pidfile=/tmp/celerybeat.pid
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: local-development-secret
      DEBUG: "true"
      DATABASE_URL: postgres://realityng:realityng@postgres:5432/realityng
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SENTRY_DSN: ""
    volumes:
      - .:/app
    depends_on:
      backend:
        condition: service_healthy
      celery:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - realityng-backend

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  realityng-backend:
    driver: bridge
