services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: realityng
      POSTGRES_USER: realityng
      POSTGRES_PASSWORD: realityng
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realityng -d realityng"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realityng-backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realityng-backend

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - realityng-backend

  backend:
    build:
      context: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: local-development-secret
      DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_URL: postgres://realityng:realityng@postgres:5432/realityng
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: realityng-local
      SENTRY_DSN: ""
      SENTRY_ENVIRONMENT: local
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - realityng-backend

  celery:
    build:
      context: .
    command: celery -A config.celery worker --loglevel=INFO
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: local-development-secret
      DEBUG: "true"
      DATABASE_URL: postgres://realityng:realityng@postgres:5432/realityng
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SENTRY_DSN: ""
    volumes:
      - .:/app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config.celery inspect ping -d celery@$$(hostname) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - realityng-backend

  celery-beat:
    build:
      context: .
    command: celery -A config.celery beat --loglevel=INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler --pidfile=/tmp/celerybeat.pid
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: local-development-secret
      DEBUG: "true"
      DATABASE_URL: postgres://realityng:realityng@postgres:5432/realityng
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SENTRY_DSN: ""
    volumes:
      - .:/app
    depends_on:
      backend:
        condition: service_healthy
      celery:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - realityng-backend

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  realityng-backend:
    driver: bridge

