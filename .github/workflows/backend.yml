name: Backend

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: realityng
          POSTGRES_USER: realityng
          POSTGRES_PASSWORD: realityng
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realityng -d realityng"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements/*.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local
          SECRET_KEY: ci-secret
          DEBUG: "true"
          DATABASE_URL: postgres://realityng:realityng@localhost:5432/realityng
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: pytest

