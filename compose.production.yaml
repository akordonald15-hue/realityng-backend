services:
  backend:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: production.txt
    env_file:
      - .env.production
    environment: !reset []
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 1
      --threads 2
      --timeout 120
      --access-logfile -
      --error-logfile -
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:18000:8000"
    volumes: !reset []
    networks: !override
      realityng-backend: {}
      shared-proxy:
        aliases:
          - realityng-backend
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    mem_limit: 512m

  postgres:
    env_file:
      - .env.production
    environment: !reset []
    restart: unless-stopped
    ports: !reset []
    volumes:
      - realityng_postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    restart: unless-stopped
    ports: !reset []
    volumes:
      - realityng_redis_data:/data
    command: redis-server --appendonly yes --maxmemory 96mb --maxmemory-policy allkeys-lru
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - .env.production
    environment: !reset []
    restart: unless-stopped
    ports: !reset []
    volumes:
      - realityng_minio_data:/data
    networks: !override
      realityng-backend: {}
      shared-proxy:
        aliases:
          - realityng-minio
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10

  minio-create-bucket:
    image: minio/mc:latest
    env_file:
      - .env.production
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET_NAME &&
      mc anonymous set download local/$$MINIO_BUCKET_NAME &&
      mc mb --ignore-existing local/$$VERIFICATION_DOCUMENT_BUCKET_NAME &&
      mc anonymous set none local/$$VERIFICATION_DOCUMENT_BUCKET_NAME &&
      mc mb --ignore-existing local/$$WALKTHROUGH_STORAGE_BUCKET &&
      mc anonymous set download local/$$WALKTHROUGH_STORAGE_BUCKET &&
      mc mb --ignore-existing local/$$INSPECTION_EVIDENCE_BUCKET &&
      mc anonymous set none local/$$INSPECTION_EVIDENCE_BUCKET &&
      mc mb --ignore-existing local/$$INSPECTION_REPORT_BUCKET &&
      mc anonymous set none local/$$INSPECTION_REPORT_BUCKET
      "
    networks:
      - realityng-backend

volumes:
  realityng_postgres_data:
  realityng_redis_data:
  realityng_minio_data:

networks:
  shared-proxy:
    external: true
